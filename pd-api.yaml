openapi: 3.2.0
info:
  description: ''
  version: 0.0.1
  title: PD-HTTP-Rest-API
  contact:
    email: developer@helferapp.com
servers:
  - url: https://server.net/api/tst_modules/
tags:
  - name: Session
    description: Login and user authentication lifecycle
  - name: Patient
    description: Patient information
  - name: Result
    description: Module (training/screening/test) results
paths:
  /ABCD/session/start:
    post:
      tags:
        - Session
      summary: >-
        Authenticate a
        LoginToken with the PD-API-Server and read patient infos.
      operationId: postSessionStart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionStartReq'
        required: true
      responses:
        '200':
          description: >-
            Successful start of session (equivalent of login) and delivery of
            patient information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStartResp'
        '400':
          description: LoginToken is invalid or timed out or any other error.
